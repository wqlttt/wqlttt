name: generate-animation

on:
  schedule:
    # 每 24 h 跑一次（UTC 00:00）
    - cron: "0 0 * * *"
  workflow_dispatch:        # 手动触发
  push:
    branches: [ main ]      # 主分支有 push 也跑一次（可改成 master）

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write       # 需要写权限才能 push 到别的分支

    steps:
      # 1. 把仓库代码拉下来（非必须，但方便后面看目录）
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 生成贪吃蛇 SVG
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}   # 自动取当前仓库拥有者
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # 3. 把 dist 目录内容推到 output 分支
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output   # 存放 SVG 的分支
          build_dir: dist
          commit_message: "auto: update snake animation"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
